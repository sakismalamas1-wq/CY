<script>
let currentInput = null;
const greekChars = "ΕΡΤΥΘΙΟΠΑΣΔΦΓΗΞΚΛΖΧΨΩΒΝΜ".split("");
const numpadChars = ["7","8","9","4","5","6","1","2","3","0",".","CLEAR"];

// Build Keyboard Letters
const lGrid = document.getElementById('lettersGrid');
if (lGrid) {
    greekChars.forEach(c => {
        let k = document.createElement('div'); 
        k.className = 'key'; 
        k.innerText = c;
        k.onclick = () => { if(currentInput) currentInput.value += c; };
        lGrid.appendChild(k);
    });
    let space = document.createElement('div'); 
    space.className = 'key wide'; 
    space.innerText = "SPACE";
    space.onclick = () => { if(currentInput) currentInput.value += " "; };
    lGrid.appendChild(space);
}

// ΔΙΟΡΘΩΣΗ: Στοχεύουμε το σωστό ID "numbersGrid" αντί για το ανύπαρκτο numpadGrid
const nGrid = document.getElementById('numbersGrid');
if (nGrid) {
    numpadChars.forEach(n => {
        let k = document.createElement('div'); 
        k.className = 'key'; 
        k.innerText = n;
        if(n === "CLEAR") k.className = "key delete";
        k.onclick = () => { 
            if(!currentInput) return;
            if(n === "CLEAR") currentInput.value = "";
            else currentInput.value += n;
        };
        nGrid.appendChild(k);
    });
}

function toggleKeyboard() {
    let k = document.getElementById('keyboardWrapper');
    if (k) k.style.display = (k.style.display === 'block') ? 'none' : 'block';
}

async function saveDeliveryData() {
    const customer = {
        phone: document.getElementById('delPhone') ? document.getElementById('delPhone').value.trim() : "",
        name: document.getElementById('delName') ? document.getElementById('delName').value.trim() : "",
        address: document.getElementById('delAddress') ? document.getElementById('delAddress').value.trim() : "",
        floor: document.getElementById('delFloor') ? document.getElementById('delFloor').value.trim() : "",
        notes: document.getElementById('delNotes') ? document.getElementById('delNotes').value.trim() : ""
    };

    if (!customer.phone || !customer.address) { 
        alert("⚠️ Τηλέφωνο και Διεύθυνση οπωσδήποτε!"); 
        return; 
    }

    try {
        await fetch('save_customer.php', {
            method: 'POST',
            body: JSON.stringify(customer)
        });
        console.log("Ο πελάτης σώθηκε στο αρχείο!");
    } catch (e) { console.error("Σφάλμα αποθήκευσης:", e); }

    selectedTable = "DELIVERY: " + customer.address;
    if (typeof allTablesData !== 'undefined') {
        if (!allTablesData[selectedTable]) { allTablesData[selectedTable] = []; }
        currentOrder = allTablesData[selectedTable];
    }
    const tTitle = document.getElementById('tableTitle');
    if (tTitle) tTitle.innerText = selectedTable;
    if (typeof renderOrder === "function") { renderOrder(); }
    alert("✅ ΠΕΛΑΤΗΣ ΟΚ ΚΑΙ ΣΩΣΜΕΝΟΣ ΣΤΟ ΑΡΧΕΙΟ!");
}

    const delView = document.getElementById('deliveryView');
    const salView = document.getElementById('salonView');
    if (delView) delView.classList.add('hidden');
    if (salView) salView.classList.remove('hidden');
    if (typeof renderTables === "function") renderTables();
}

function showDelivery() {
    const salView = document.getElementById('salonView');
    const delView = document.getElementById('deliveryView');
    if (salView) salView.classList.add('hidden');
    if (delView) {
        delView.classList.remove('hidden');
        delView.style.display = 'flex';
    }
}

function applyStylesFromAdmin() {
    try {
        const saved = JSON.parse(localStorage.getItem('gbr_ui_settings') || "{}");
        if (saved['--gbr-cyan']) {
            document.documentElement.style.setProperty('--gbr-cyan', saved['--gbr-cyan']);
            const buttons = document.querySelectorAll('.btn-prod, .btn-nav-gbr');
            buttons.forEach(btn => { btn.style.borderColor = saved['--gbr-cyan']; });
        }
    } catch (e) { console.error(e); }
}

// ΔΙΟΡΘΩΜΕΝΟ ΡΟΛΟΪ
function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");
    
    const clockElement = document.getElementById("posClock");
    if (clockElement) {
        clockElement.innerText = `${hours}:${minutes}:${seconds}`;
    }
}
 
// Εκκίνηση ρολογιού (Τρέχει κάθε 1 δευτερόλεπτο - ΣΩΣΤΟ)
setInterval(updateClock, 1000);
updateClock();
 
// Εφαρμογή των στυλ ΜΟΝΟ ΜΙΑ ΦΟΡΑ όταν ανοίγει το POS (ΣΩΣΤΟ)
window.addEventListener('DOMContentLoaded', applyStylesFromAdmin);

// 🔥 ΤΟ setInterval(applyStylesFromAdmin, 1000); ΔΙΑΓΡΑΦΗΚΕ ΓΙΑΤΙ ΕΣΒΗΝΕ ΤΙΣ ΠΑΡΑΓΓΕΛΙΕΣ!
</script>
